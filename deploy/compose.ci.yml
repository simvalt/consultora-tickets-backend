# Base efimera exclusiva de pruebas; nunca usa la red ni el volumen de la demo.
name: consultora-tickets-ci
services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets-ci-disposable
      POSTGRES_DB: tickets_migrations
    mem_limit: 512m
    cpus: 1
    pids_limit: 150
    tmpfs: ["/var/lib/postgresql/data:size=512m,mode=0700"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tickets -d tickets_migrations"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: consultora-tickets-migrate:ci
    build: ${DATABASE_REPO_PATH:-../consultora-tickets-database}
    environment:
      DATABASE_URL: postgresql://tickets:tickets-ci-disposable@db:5432/tickets_migrations
      PYTHONDONTWRITEBYTECODE: "1"
    mem_limit: 512m
    cpus: 1
    pids_limit: 100
    command: [sh, -ec, "alembic upgrade head && alembic downgrade base && alembic upgrade head"]
  checks:
    image: consultora-tickets-checks:ci
    build:
      context: .
      dockerfile: deploy/ci.Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://tickets:tickets-ci-disposable@db:5432/tickets_test
      DATABASE_REPO_PATH: /workspace/consultora-tickets-database
      TICKETS_TEST_FAILURE_MODE: ${TICKETS_TEST_FAILURE_MODE:-strict}
    volumes:
      - ${DATABASE_REPO_PATH:-../consultora-tickets-database}:/workspace/consultora-tickets-database:ro
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 200
