# Orquesta los TRES repositorios. Rutas hermanas esperadas (configurables en .env):
#
#   <carpeta>/consultora-tickets-database   ← DATABASE_REPO_PATH (migraciones y seeds)
#   <carpeta>/consultora-tickets-backend    ← este repositorio
#   <carpeta>/consultora-tickets-frontend   ← FRONTEND_REPO_PATH
#
# Uso:   cp .env.example .env && docker compose up -d --build
#        docker compose --profile demo up -d --build   (además carga datos de demostración, SOLO local)
name: consultora-tickets

services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica las migraciones (única fuente: repo database) y crea el administrador inicial. Termina al acabar.
  migrate:
    build: ${DATABASE_REPO_PATH:-../consultora-tickets-database}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickets}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?define ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?define ADMIN_PASSWORD en .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
    command: ["sh", "-c", "alembic upgrade head && python seed/seed.py base"]

  # Opcional (perfil «demo»): datos de demostración. Se niega a correr con APP_ENV=production.
  seed-demo:
    profiles: ["demo"]
    build: ${DATABASE_REPO_PATH:-../consultora-tickets-database}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickets}
      APP_ENV: ${APP_ENV:-local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?define DEMO_PASSWORD en .env para usar el perfil demo}
    command: ["python", "seed/seed.py", "demo"]

  backend:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tickets}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tickets}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (mínimo 32 caracteres)}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_MAX_ATTEMPTS_IP: ${LOGIN_MAX_ATTEMPTS_IP:-20}
      LOGIN_MAX_ATTEMPTS_EMAIL: ${LOGIN_MAX_ATTEMPTS_EMAIL:-10}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      DOCS_ENABLED: ${DOCS_ENABLED:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ${FRONTEND_REPO_PATH:-../consultora-tickets-frontend}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      API_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"

volumes:
  pgdata:
