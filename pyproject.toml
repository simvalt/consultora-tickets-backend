[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends()/Query() en argumentos es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731"]
